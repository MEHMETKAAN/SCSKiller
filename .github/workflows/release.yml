# Bir sürüm etiketi, tam olarak build.yml gibi derler, test eder ve paketler, ardından TASLAK bir GitHub Sürümü (Release) oluşturur
# İMZASIZ zip, SHA256SUMS-unsigned.txt ve CHANGELOG.md bölümü ile birlikte. CI (Sürekli Entegrasyon) orada durur:
# sürüm adımı (yerel olarak çalıştırılır) bu baytları indirir, kontrol eder, imzalar (bulut HSM: CI'da hiçbir zaman imzalama anahtarı veya
# sertifika bulunmaz), vpk pack'i çalıştırır, akışı çevrimdışı anahtarla imzalar ve yayınlar. Burada hiçbir şey yayınlanmaz.
#
# Depoya göre kanal: gizli depo beta/alfa etiketlerini ('-' ile, v1.5.0-beta.1) yayınlar, açık depo kararlı (stable)
# etiketleri (v1.5.0). server-v* etiketleri v* değildir ve ayrı bir gizli Linux iş akışına aittir (henüz yazılmadı).
# -internal etiketleri talep üzerine (etiket üzerinde build.yml workflow_dispatch) veya yerel bir bilgisayarda derlenir: taslak (draft) oluşturulmaz.
name: release

on:
  push:
    tags: ['v*', '!v*-internal*']

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.private == contains(github.ref_name, '-')
    uses: ./.github/workflows/build.yml

  draft:
    needs: build
    runs-on: ubuntu-latest   # 1x dakika; yalnızca yüklemeler
    timeout-minutes: 10
    permissions:
      contents: write        # taslak sürüm (draft release)
      id-token: write        # onay belgesi (attestation - açık depo)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: SCSKiller-unsigned   # SCSKiller.zip + SHA256SUMS-unsigned.txt

      - name: Zip dosyasını toplamlara (sums) karşı kontrol et
        run: grep '  SCSKiller.zip$' SHA256SUMS-unsigned.txt | sha256sum -c -

      # Sigstore'un genel günlüğündeki (public log) kaynak bilgisi (provenance): yalnızca açık depodaki kararlı derlemeler.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-path: SCSKiller.zip

      - name: CHANGELOG.md'den sürüm notları
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          [ -f CHANGELOG.md ] || { echo "::error::no CHANGELOG.md"; exit 1; }
          awk -v v="$v" '/^## /{ p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## [$v]' section"; exit 1; }

      - name: Taslak sürüm (yayınlanmadı)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=(); [[ "$TAG" == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" SCSKiller.zip SHA256SUMS-unsigned.txt --draft --verify-tag "${pre[@]}" \
            --title "SCSKiller $TAG" --notes-file notes.md
