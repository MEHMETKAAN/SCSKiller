name: Oyun isteği
description: SCSKiller'ın henüz desteklemediği veya kötü desteklediği bir oyunu eklememizi isteyin.
labels: [game request]
body:
  - type: input
    id: game
    attributes:
      label: Oyun
      placeholder: Oyunun Adı
    validations:
      required: true
  - type: input
    id: store
    attributes:
      label: Mağaza ve bağlantı
      description: Satıldığı yer, bir bağlantı veya mağazanın uygulama kimliği (app id) ile birlikte.
      placeholder: Steam, https://store.steampowered.com/app/000000/
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Biliyorsanız oyun motoru
      placeholder: Unreal Engine 5.4 / Unity / RE Engine / bilinmiyor
  - type: dropdown
    id: api
    attributes:
      label: Oyunun kullandığı Grafik API'si
      options: [D3D12, D3D11, Vulkan, Bilmiyorum]
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: SCSKiller bu oyun hakkında ne diyor?
      description: Eğer algılandıysa, uygulamanın oyun için gösterdiği mevcut durum.
  - type: textarea
    id: stutter
    attributes:
      label: Takılma (Stutter) durumu
      description: Ne zaman olduğu (bir bölgeye ilk girişte, çatışmada vb.) ve bunu açıklayan herhangi bir bağlantı.
  - type: checkboxes
    id: anticheat
    attributes:
      label: Anti-hile
      options:
        - label: Bildiğim kadarıyla oyun anti-hile (Easy Anti-Cheat, BattlEye vb.) kullanıyor.
