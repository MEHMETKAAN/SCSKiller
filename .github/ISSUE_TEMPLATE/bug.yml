name: Hata bildirimi
description: Bir şeyler çalışmıyor veya bir oyun gerektiği gibi algılanmıyor ya da derlenmiyor.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: SCSKiller sürümü
      description: Uygulamanın Hakkında sayfasında gösterilir.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows sürümü
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Ekran Kartı (GPU)
      placeholder: NVIDIA GeForce RTX 4070 / AMD Radeon RX 7800 XT
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: GPU sürücü sürümü
      placeholder: "NVIDIA 610.88 / AMD Adrenalin 26.10.1"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Oyun
      description: Adı ve yüklendiği mağaza (Steam, Epic, EA app, GOG, Ubisoft Connect, Xbox, Battle.net). Hata bir oyunla ilgili değilse boş bırakın.
      placeholder: Oyunun Adı (Steam)
  - type: textarea
    id: what
    attributes:
      label: Ne oldu ve ne bekliyordunuz?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Hatayı yeniden oluşturma adımları
      placeholder: |
        1. SCSKiller'ı açın
        2. ... üzerinde Derle'ye basın
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Çıktı veya hata metni
      description: Gösterilen hata veya 'scskiller status "<oyun>"' çıktısı. Eğer SCSKiller kendi kendine kapandıysa veya başlamadıysa '%LOCALAPPDATA%\SCSKiller' içindeki 'crash.log' dosyasının son kısmı. Kişisel bilgileri (yollardaki kullanıcı adları vb.) kaldırın.
      render: text
